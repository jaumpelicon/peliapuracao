services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - TSE_ENV=oficial
      - TSE_BASE_URL=https://resultados.tse.jus.br
      - TSE_TURNO=1
      - TSE_MAX_RPS=30
      - TSE_MAX_CONCURRENCY=10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
