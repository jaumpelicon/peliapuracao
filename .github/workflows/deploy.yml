name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '*/5 * * * *' # atualiza a cada 5 minutos (limite do GitHub Actions)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Fetch TSE data
        env:
          TSE_ENV: oficial
          TSE_TURNO: 1
          TSE_MAX_RPS: 30
          TSE_MAX_CONCURRENCY: 10
        run: npx tsx tools/fetch-data.ts

      - name: Generate static site
        env:
          TSE_TURNO: 1
        run: npm run generate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
